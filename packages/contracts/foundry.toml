[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.29"
evm_version = "cancun"

[rpc_endpoints]
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
unichain = "${UNICHAIN_RPC}"

[fuzz]
runs = 10000

[invariant]
runs = 1000
depth = 50

[etherscan]
unichain_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.uniscan.xyz/api" }
unichain = { key = "${ETHERSCAN_API_KEY}", url = "https://api.uniscan.xyz/api" }
