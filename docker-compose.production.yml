name: daodegen-production
services:
  frontend:
    image: ghcr.io/0xpotatoofdoom/daodegen:latest
    restart: unless-stopped
    env_file:
      - production.env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
